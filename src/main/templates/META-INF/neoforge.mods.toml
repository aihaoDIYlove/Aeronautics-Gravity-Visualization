# This is the neoforge.mods.toml for the Aeronautics Suite jar.
# 一个 jar 三个 mod：重力可视化 / 方便物品 / 星空物流。
# 三者共享同一 sourceSet、同一个 mixin config 与同一份 COMMON 配置（挂在 gravity_visualization 名下）。

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# The version range to match for said mod loader. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license of the mod.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# ─────────────────────────────────────────────────────────────────────────────
# Mod 1: 航空学：重力可视化
# ─────────────────────────────────────────────────────────────────────────────
[[mods]]
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="icon.png"
authors="${mod_authors}"
description='''
This mod adds a series of items that facilitate player debugging and balancing. 

It includes the Spark Wand, which can be used to display physical structures,

as well as balancing blocks/light blocks that can be adjusted for mass through manual/redstone methods.
'''

# ─────────────────────────────────────────────────────────────────────────────
# Mod 2: 航空学：方便物品
# ─────────────────────────────────────────────────────────────────────────────
[[mods]]
modId="${mod_id_2}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name_2}" #mandatory
logoFile="icon.png"
authors="${mod_authors}"
description='''
Added some convenient transmission/synthesis machines
'''

# ─────────────────────────────────────────────────────────────────────────────
# Mod 3: 航空学：星空物流
# ─────────────────────────────────────────────────────────────────────────────
[[mods]]
modId="${mod_id_3}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name_3}" #mandatory
logoFile="icon.png"
authors="${mod_authors}"
description='''
Using world_anchor, parcels can be transported around the world, 

and even Ender Pearls can be packed for teleporting players themselves
'''

# 全 jar 共用一个 mixin config（mixins 本身与 mod id 无关，按目标类路由）
[[mixins]]
config="aero_suite.mixins.json"

# ─────────────────────────────────────────────────────────────────────────────
# 依赖：三个 mod 依赖相同（该 jar 整体离不开这些前置，拆开写没有收益）
# ─────────────────────────────────────────────────────────────────────────────

# ---- ${mod_name} ----
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="simulated"
    type="required"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="required"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

# ---- ${mod_name_2} ----
[[dependencies.${mod_id_2}]]
