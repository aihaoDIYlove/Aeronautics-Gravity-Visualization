# This is the neoforge.mods.toml for the Aeronautics Suite jar.
# 一个 jar 三个 mod：重力可视化 / 方便物品 / 星空物流。
# 三者共享同一 sourceSet、同一个 mixin config 与同一份 COMMON 配置（挂在 gravity_visualization 名下）。

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# The version range to match for said mod loader. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The license of the mod.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# ─────────────────────────────────────────────────────────────────────────────
# Mod 1: 航空学：重力可视化
# ─────────────────────────────────────────────────────────────────────────────
[[mods]]
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
description='''
Mass visualization tools for Create: Aeronautics contraptions.

Spark Wand: visualize block mass and center of mass on contraptions; also a combat item with fire damage, the Creeper Buster enchantment, and a handheld goggle substitute.

Portable Diagram: right-click a contraption to open its diagram view without placing a diagram entity on a wall.

Counterweight / Counterweight-Light blocks: per-block mass and buoyancy tuning via scroll board or redstone signal, with multiple skins.
'''

# ─────────────────────────────────────────────────────────────────────────────
# Mod 2: 航空学：方便物品
# ─────────────────────────────────────────────────────────────────────────────
[[mods]]
modId="${mod_id_2}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name_2}" #mandatory
description='''
Convenience additions for Create: Aeronautics machines.

Convenient Analog Transmission: fixed-RPM analog transmission driven by redstone signal (0-15).

Variable Speed Portable Engine: portable engine with a scroll-adjustable 15-step speed board (32-256 RPM) and 16 dyeable variants.

Sequential Feeder: programmable dispensing tape with 9 ghost marker slots and 9 inventory slots, stepping per pulse or per extraction.
'''

# ─────────────────────────────────────────────────────────────────────────────
# Mod 3: 航空学：星空物流
# ─────────────────────────────────────────────────────────────────────────────
[[mods]]
modId="${mod_id_3}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name_3}" #mandatory
description='''
Starlight logistics built on the End Sea.

Starlight Fluid + Void Hose Pulley: non-spreading source fluid drawn infinitely from the End Sea force field.

Lightweight / Ultralight Glass, Starlight Casing, Stabilizer, World Anchor, Addressing Sign, Activated Ender Pearl: cross-dimensional package logistics and end-sea material conversion.
'''

# 全 jar 共用一个 mixin config（mixins 本身与 mod id 无关，按目标类路由）
[[mixins]]
config="aero_suite.mixins.json"

# ─────────────────────────────────────────────────────────────────────────────
# 依赖：三个 mod 依赖相同（该 jar 整体离不开这些前置，拆开写没有收益）
# ─────────────────────────────────────────────────────────────────────────────

# ---- ${mod_name} ----
[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sable"
    type="required"
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="simulated"
    type="required"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="aeronautics"
    type="required"
    versionRange="[1.3.0,)"
    ordering="AFTER"
    side="BOTH"

# ---- ${mod_name_2} ----
[[dependencies.${mod_id_2}]]
